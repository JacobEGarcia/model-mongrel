<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MODEL MONGREL</title><style>
:root{--bg:#08090b;--panel:#101216;--line:#292d34;--ink:#ecede8;--muted:#747b86;--lime:#baff45;--pink:#ff648d;--cyan:#54d9ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;min-height:100vh}.shell{max-width:1220px;margin:auto;padding:35px 22px 70px}header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px}.logo{font-size:clamp(28px,5vw,59px);font-weight:950;letter-spacing:-.075em;line-height:.9}.logo span{color:var(--lime)}.sub{color:var(--muted);margin-top:10px}.status{text-align:right;color:var(--lime);font-size:11px;letter-spacing:.16em}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 14px var(--lime)}.grid{display:grid;grid-template-columns:.82fr 1.18fr;gap:16px}.panel{border:1px solid var(--line);background:var(--panel);border-radius:15px;padding:18px}.panel h2{font-size:10px;color:var(--muted);letter-spacing:.17em;margin:0 0 15px}.task{width:100%;height:122px;resize:none;background:#090b0e;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;outline:0}.task:focus{border-color:#57606c}.slider{margin:15px 0}.lab{display:flex;justify-content:space-between}.lab b{color:var(--lime)}input[type=range]{width:100%;accent-color:var(--lime)}.toggles{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:15px 0}.toggle{border:1px solid var(--line);border-radius:9px;padding:9px;color:var(--muted);cursor:pointer;background:#0b0d10}.toggle.on{border-color:#60792f;color:var(--lime);background:#11170b}.route{width:100%;padding:13px;border:0;border-radius:10px;background:var(--lime);font-weight:900;color:#0a0b0c;cursor:pointer}.models{display:grid;gap:8px}.model{display:grid;grid-template-columns:1fr 78px 78px 90px;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:#0b0d10;transition:.2s}.model small{display:block;color:var(--muted)}.model.win{border-color:var(--lime);box-shadow:0 0 0 1px #baff4520;background:#11160b}.metric{text-align:right}.metric b{display:block}.bar{height:3px;background:#292d31;margin-top:5px}.bar i{display:block;height:100%;background:var(--cyan)}.privacy{text-align:right;color:var(--muted)}.result{grid-column:1/-1;display:none;border-color:#5d742f}.result.on{display:block}.result-top{display:flex;justify-content:space-between;gap:16px;align-items:start}.winner{font-size:29px;font-weight:950;letter-spacing:-.05em}.winner span{color:var(--lime)}.reason{color:#bdc2bd;max-width:650px}.score{font-size:32px;color:var(--lime)}.trace{margin-top:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.trace div{padding:11px;background:#0a0c0e;border-radius:9px}.trace small{color:var(--muted);display:block}.trace b{font-size:17px}.history{grid-column:1/-1}.history-row{display:grid;grid-template-columns:1fr 160px 100px;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.history-row:first-of-type{border:0}.tag{color:var(--lime)}.empty{color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}.model{grid-template-columns:1fr 60px 60px}.privacy{display:none}.trace{grid-template-columns:1fr 1fr}.status{display:none}.history-row{grid-template-columns:1fr 100px}.history-row>:last-child{display:none}}
</style></head><body><main class="shell"><header><div><div class="logo">MODEL <span>MONGREL</span></div><div class="sub">constraint-aware AI routing / no brand loyalty</div></div><div class="status"><span class="dot"></span> ROUTER ONLINE<br><span style="color:#737a84">LOCAL DECISION ENGINE</span></div></header><div class="grid"><section class="panel"><h2>01 / DEFINE THE RUN</h2><textarea class="task" id="task">Analyze a confidential contract and return a precise risk summary.</textarea><div class="slider"><div class="lab"><span>MAX COST / 1M TOKENS</span><b id="costV">$8.00</b></div><input id="cost" type="range" min="1" max="30" value="8"></div><div class="slider"><div class="lab"><span>LATENCY CEILING</span><b id="latV">4.0s</b></div><input id="lat" type="range" min="1" max="12" value="4"></div><div class="toggles"><button class="toggle on" data-k="privacy">PRIVATE DATA</button><button class="toggle on" data-k="quality">QUALITY FIRST</button><button class="toggle" data-k="local">LOCAL ONLY</button><button class="toggle" data-k="long">LONG CONTEXT</button></div><button class="route" id="route">ROUTE TASK →</button></section><section class="panel"><h2>02 / AVAILABLE PACK</h2><div class="models" id="models"></div></section><section class="panel result" id="result"><div class="result-top"><div><div class="winner" id="winner"></div><div class="reason" id="reason"></div></div><div class="score" id="score"></div></div><div class="trace" id="trace"></div></section><section class="panel history"><h2>ROUTING LEDGER / SAVED LOCALLY</h2><div id="history"></div></section></div></main><script>
const models=[{name:'Swift 8B',host:'LOCAL',cost:.0,lat:1.1,q:66,priv:100,ctx:32},{name:'Reasoner R1',host:'PRIVATE VPC',cost:2.2,lat:7.2,q:94,priv:88,ctx:128},{name:'Frontier X',host:'CLOUD API',cost:12,lat:4.8,q:97,priv:62,ctx:200},{name:'Balanced 70B',host:'PRIVATE VPC',cost:5.5,lat:3.5,q:89,priv:86,ctx:64},{name:'Flash Pro',host:'CLOUD API',cost:1.1,lat:.7,q:81,priv:58,ctx:100}];let opts={privacy:true,quality:true,local:false,long:false};let hist=JSON.parse(localStorage.getItem('mongrel-runs')||'[]');const $=s=>document.querySelector(s);function renderModels(win){$('#models').innerHTML=models.map((m,i)=>`<div class="model ${i===win?'win':''}"><div><b>${m.name}</b><small>${m.host}</small></div><div class="metric"><b>$${m.cost.toFixed(2)}</b><small>cost</small></div><div class="metric"><b>${m.lat}s</b><small>latency</small></div><div class="privacy"><b>${m.priv}</b><small>privacy</small><div class="bar"><i style="width:${m.priv}%"></i></div></div></div>`).join('')}function showHistory(){let h=$('#history');h.innerHTML=hist.length?hist.slice(0,6).map(x=>`<div class="history-row"><div>${esc(x.task)}</div><div class="tag">→ ${x.model}</div><div>${x.time}</div></div>`).join(''):'<div class="empty">No runs yet. The router remembers decisions, not prompts sent elsewhere.</div>'}function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}$('#cost').oninput=e=>$('#costV').textContent='$'+(+e.target.value).toFixed(2);$('#lat').oninput=e=>$('#latV').textContent=(+e.target.value).toFixed(1)+'s';document.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>{opts[b.dataset.k]=!opts[b.dataset.k];b.classList.toggle('on')});$('#route').onclick=()=>{let maxC=+$('#cost').value,maxL=+$('#lat').value,task=$('#task').value.trim()||'Untitled task';let scored=models.map((m,i)=>{let s=m.q*(opts.quality?1.2:.65)+Math.max(0,30-m.cost*2)+Math.max(0,25-m.lat*3);if(m.cost>maxC)s-=55;if(m.lat>maxL)s-=35;if(opts.privacy)s+=(m.priv-50)*.75;if(opts.local)s+=m.host==='LOCAL'?100:-100;if(opts.long)s+=m.ctx>100?35:-20;if(/code|program|debug/i.test(task)&&['Reasoner R1','Frontier X'].includes(m.name))s+=15;if(/quick|simple|classify/i.test(task)&&m.lat<2)s+=18;return{i,s}}).sort((a,b)=>b.s-a.s);let w=models[scored[0].i],confidence=Math.max(62,Math.min(99,Math.round(65+(scored[0].s-scored[1].s)/2)));renderModels(scored[0].i);$('#winner').innerHTML=`ROUTE → <span>${w.name}</span>`;let reasons=[];if(opts.local)reasons.push('local-only constraint');else if(opts.privacy)reasons.push('privacy-weighted hosting');if(opts.quality)reasons.push('quality priority');if(w.cost<=maxC)reasons.push('inside cost ceiling');if(w.lat<=maxL)reasons.push('inside latency ceiling');$('#reason').textContent='Selected for '+reasons.join(', ')+'. The route is computed from constraints, not a preferred provider.';$('#score').textContent=confidence+'%';$('#trace').innerHTML=`<div><small>QUALITY</small><b>${w.q}/100</b></div><div><small>EST. COST</small><b>$${w.cost.toFixed(2)}</b></div><div><small>EST. LATENCY</small><b>${w.lat}s</b></div><div><small>DATA CONTROL</small><b>${w.priv}/100</b></div>`;$('#result').classList.add('on');hist.unshift({task:task.slice(0,80),model:w.name,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});hist=hist.slice(0,20);localStorage.setItem('mongrel-runs',JSON.stringify(hist));showHistory()};renderModels(-1);showHistory();</script></body></html>
